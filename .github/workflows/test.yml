name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest

  platform-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exercise the declared lower and upper bounds on Windows.
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.13"
          # Exercise the declared lower and upper bounds on macOS.
          - os: macos-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: python research/validate_artifact_contents.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: mkdocs build --strict
      - run: python examples/sklearn_pipeline.py
      - run: python examples/detect_tampering.py
      - run: python examples/signed_artifact.py
        env:
          MODELSTAMP_SIGNING_KEY: ci-example-key

  # Preserve the established required-check name while the platform matrix
  # adds lower- and upper-bound Windows coverage.
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest

  wheel-smoke:
    name: Wheel smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Install the built wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "import glob, subprocess, sys;
          wheels = glob.glob(r'${{ github.workspace }}/dist/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheels[0]])"
      - name: Exercise installed package and CLI outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import importlib.metadata, modelstamp; assert importlib.metadata.version('modelstamp') == modelstamp.__version__"
          python -m modelstamp --help
