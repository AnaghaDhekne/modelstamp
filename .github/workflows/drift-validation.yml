name: Dependency drift validation

on:
  push:
    paths:
      - ".github/workflows/drift-validation.yml"
      - "benchmarks/drift_matrix_case.py"
  pull_request:
    paths:
      - ".github/workflows/drift-validation.yml"
      - "benchmarks/drift_matrix_case.py"

permissions:
  contents: read

jobs:
  drift-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: sklearn-patch
            framework: sklearn
            save-spec: scikit-learn==1.5.1 numpy==1.26.4 scipy==1.13.1 joblib==1.4.2
            check-spec: scikit-learn==1.5.2 numpy==1.26.4 scipy==1.13.1 joblib==1.4.2
            expected: scikit-learn
          - scenario: sklearn-minor
            framework: sklearn
            save-spec: scikit-learn==1.5.2 numpy==1.26.4 scipy==1.13.1 joblib==1.4.2
            check-spec: scikit-learn==1.6.1 numpy==1.26.4 scipy==1.13.1 joblib==1.4.2
            expected: scikit-learn
          - scenario: xgboost-cross-version
            framework: xgboost
            save-spec: xgboost==2.1.3 numpy==1.26.4 scipy==1.13.1 joblib==1.4.2
            check-spec: xgboost==3.0.2 numpy==1.26.4 scipy==1.13.1 joblib==1.4.2
            expected: xgboost
          - scenario: lightgbm-cross-version
            framework: lightgbm
            save-spec: lightgbm==4.5.0 scikit-learn==1.5.2 numpy==1.26.4 scipy==1.13.1 joblib==1.4.2
            check-spec: lightgbm==4.6.0 scikit-learn==1.5.2 numpy==1.26.4 scipy==1.13.1 joblib==1.4.2
            expected: lightgbm
          - scenario: lightgbm-embedded-sklearn-drift
            framework: lightgbm
            save-spec: lightgbm==4.6.0 scikit-learn==1.3.2 numpy==1.26.4 scipy==1.13.1 joblib==1.4.2
            check-spec: lightgbm==4.6.0 scikit-learn==1.9.0 numpy==1.26.4 scipy==1.13.1 joblib==1.4.2
            expected: scikit-learn
          - scenario: numpy-relevant-change
            framework: sklearn
            save-spec: scikit-learn==1.5.2 numpy==1.26.4 scipy==1.13.1 joblib==1.4.2
            check-spec: scikit-learn==1.5.2 numpy==2.0.2 scipy==1.13.1 joblib==1.4.2
            expected: numpy
          - scenario: joblib-relevant-change
            framework: sklearn
            save-spec: scikit-learn==1.5.2 numpy==1.26.4 scipy==1.13.1 joblib==1.3.2
            check-spec: scikit-learn==1.5.2 numpy==1.26.4 scipy==1.13.1 joblib==1.4.2
            expected: joblib
          - scenario: unrelated-pandas-noise
            framework: sklearn
            save-spec: scikit-learn==1.5.2 numpy==1.26.4 scipy==1.13.1 joblib==1.4.2 pandas==2.2.3
            check-spec: scikit-learn==1.5.2 numpy==1.26.4 scipy==1.13.1 joblib==1.4.2 pandas==2.3.1
            expected: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build Modelstamp wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Save model under environment A
        run: |
          python -m venv "${RUNNER_TEMP}/save-env"
          "${RUNNER_TEMP}/save-env/bin/python" -m pip install dist/*.whl ${{ matrix.save-spec }}
          "${RUNNER_TEMP}/save-env/bin/python" benchmarks/drift_matrix_case.py save \
            --framework "${{ matrix.framework }}" \
            --scenario "${{ matrix.scenario }}" \
            --artifact "${RUNNER_TEMP}/model.joblib" | tee "${RUNNER_TEMP}/save.json"
      - name: Check model under environment B
        run: |
          python -m venv "${RUNNER_TEMP}/check-env"
          "${RUNNER_TEMP}/check-env/bin/python" -m pip install dist/*.whl ${{ matrix.check-spec }}
          "${RUNNER_TEMP}/check-env/bin/python" benchmarks/drift_matrix_case.py check \
            --scenario "${{ matrix.scenario }}" \
            --expected-changes "${{ matrix.expected }}" \
            --artifact "${RUNNER_TEMP}/model.joblib" | tee "${RUNNER_TEMP}/check.json"
      - name: Publish observed result
        if: always()
        run: |
          echo "### ${{ matrix.scenario }}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```json' >> "${GITHUB_STEP_SUMMARY}"
          test ! -f "${RUNNER_TEMP}/check.json" || cat "${RUNNER_TEMP}/check.json" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
