[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelstamp"
version = "0.1.0"
description = "Version-aware persistence for scikit-learn and friends: stamp the training environment and warn on silent mismatch."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Anagha Dhekne", email = "anaghagdhekne7@gmail.com" }]
keywords = [
    "scikit-learn",
    "machine-learning",
    "pickle",
    "joblib",
    "reproducibility",
    "model-persistence",
    "mlops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Zero required runtime dependencies. joblib is used if present (it ships with
# scikit-learn anyway) but pickle is the built-in fallback.
dependencies = []

[project.optional-dependencies]
joblib = ["joblib>=1.0"]
test = ["pytest>=7.0", "joblib>=1.0"]
dev = ["pytest>=7.0", "joblib>=1.0", "build", "twine", "ruff"]

[project.scripts]
modelstamp = "modelstamp.cli:main"

[project.urls]
Homepage = "https://github.com/AnaghaDhekne/modelstamp"
Repository = "https://github.com/AnaghaDhekne/modelstamp"
Issues = "https://github.com/AnaghaDhekne/modelstamp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/modelstamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I"]
