[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelstamp"
version = "0.1.0"
description = "Save ML models with integrity checks and reproducible environment manifests."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anagha Dhekne", email = "anaghagdhekne7@gmail.com" }]
keywords = [
    "scikit-learn",
    "machine-learning",
    "pickle",
    "joblib",
    "reproducibility",
    "model-persistence",
    "model-integrity",
    "model-versioning",
    "mlops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
joblib = ["joblib>=1.0"]
test = ["pytest>=7.0", "hypothesis>=6.0", "joblib>=1.0"]
docs = ["mkdocs>=1.5", "mkdocstrings[python]>=0.24"]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "joblib>=1.0",
    "build",
    "twine",
    "ruff",
    "mkdocs>=1.5",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
modelstamp = "modelstamp.cli:main"

[project.urls]
Homepage = "https://github.com/AnaghaDhekne/modelstamp"
Repository = "https://github.com/AnaghaDhekne/modelstamp"
Issues = "https://github.com/AnaghaDhekne/modelstamp/issues"
Changelog = "https://github.com/AnaghaDhekne/modelstamp/blob/main/CHANGELOG.md"
Security = "https://github.com/AnaghaDhekne/modelstamp/security/policy"
Documentation = "https://anaghadhekne.github.io/modelstamp/"

[tool.hatch.build.targets.wheel]
packages = ["src/modelstamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I"]
