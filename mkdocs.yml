site_name: modelstamp
site_description: Pre-deserialization integrity and environment verification for persisted Python machine-learning artifacts.
site_url: https://anaghadhekne.github.io/modelstamp/
repo_url: https://github.com/AnaghaDhekne/modelstamp
repo_name: AnaghaDhekne/modelstamp
edit_uri: edit/main/docs/

theme:
  name: mkdocs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            members_order: source

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Use cases:
      - Detect dependency drift: dependency-drift.md
      - Verify joblib artifacts: verify-joblib.md
      - CI/CD verification: ci.md
      - Model risk case study: model-risk-case-study.md
      - Comparisons: comparisons.md
  - Runnable examples: examples.md
  - Research use & citation: research-use.md
  - Research & adoption: research-adoption.md
  - Architecture decisions:
      - Decision log: architecture-decisions.md
      - Verify before reconstruction: decisions/0001-pre-deserialization-verification.md
      - Sidecar manifest: decisions/0002-sidecar-manifest.md
      - Dependency relevance: decisions/0003-dependency-relevance.md
      - Integrity and authenticity: decisions/0004-integrity-and-authenticity.md
      - Compatibility, not replication: decisions/0005-compatibility-not-replication.md
      - ADR template: decisions/0000-template.md
  - Signing and key rotation: signing.md
  - Security: security.md
  - API reference: api.md
  - Benchmarks:
      - Verification throughput: benchmarks.md
      - Dependency drift matrix: drift-benchmarks.md
      - sklearn version-drift experiment: sklearn-version-drift.md
      - Reproducible research evidence: reproducible-evidence.md
  - Release checklist: releasing.md

strict: true
